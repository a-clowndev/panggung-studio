AutoName: Panggung Studio
Summary: Standalone mobile broadcast & recording studio powered by libobs
Description: |-
  Panggung Studio is an open-source, standalone Android broadcast and recording
  studio built on top of libobs (OBS Studio 33.0.3) with an EGL/OpenGL ES 3.2
  renderer, hardware MediaCodec H.264/HEVC and software x264 encoders, Studio Mode,
  scene transitions, video/audio filters, Replay Buffer, obs-websocket v5, built-in
  Web Remote UI, embedded Lua scripting (obslua), and sideloadable .pgplugin support.

