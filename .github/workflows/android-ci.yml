name: Android CI (Native + Rust + APK)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build nasm yasm pkg-config autoconf automake libtool gettext autopoint texinfo

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK & NDK r27
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Setup Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cross-compiled native deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: native/deps/install
          key: panggung-deps-arm64-v2-${{ hashFiles('tools/build-deps*.sh') }}

      - name: Build native deps (if cache miss)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: ./tools/build-deps-full.sh

      - name: Build libobs + Android plugins
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: ./tools/build-libobs.sh

      - name: Build Rust panggung-core (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -P 29 -o app/src/main/jniLibs build -p panggung-core --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: panggung-studio-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
