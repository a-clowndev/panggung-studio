name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag version (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-android-arm64:
    name: Build & Release Panggung Studio (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version & tag
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer tag: $TAG (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          VER="${TAG#v}"
          BASE="${VER%%-*}"
          IFS='.' read -r MAJ MIN PAT <<< "$BASE"
          PRE_RANK=9
          if [[ "$VER" == *-* ]]; then
            PRE="${VER#*-}"
            NUM="${PRE##*.}"
            [[ "$NUM" =~ ^[0-9]+$ ]] || NUM=1
            case "$PRE" in
              alpha*) PRE_RANK=$(( (NUM > 3 ? 3 : NUM) )) ;;
              beta*)  PRE_RANK=$(( 3 + (NUM > 3 ? 3 : NUM) )) ;;
              rc*)    PRE_RANK=$(( 6 + (NUM > 2 ? 2 : NUM) )) ;;
              *)      PRE_RANK=1 ;;
            esac
          fi
          VCODE=$((MAJ * 100000 + MIN * 1000 + PAT * 10 + PRE_RANK))
          if [[ "$VCODE" -lt 1 ]]; then VCODE=1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Resolved TAG=$TAG VERSION_NAME=$VER VERSION_CODE=$VCODE"

      - name: Create and push git tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            git tag -a "${{ steps.ver.outputs.tag }}" -m "Panggung Studio ${{ steps.ver.outputs.tag }}"
            git push origin "${{ steps.ver.outputs.tag }}"
          fi

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build nasm yasm pkg-config autoconf automake libtool gettext autopoint texinfo

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK & NDK r27
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Setup Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cross-compiled native deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: native/deps/install
          key: panggung-deps-arm64-v2-${{ hashFiles('tools/build-deps*.sh') }}

      - name: Build native dependencies (FFmpeg, x264, x265, libaom, libsrt, SpeexDSP)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: ./tools/build-deps-full.sh

      - name: Build libobs 33.0.3 + libobs-gles + Android plugins
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: ./tools/build-libobs.sh

      - name: Build Rust panggung-core (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -P 29 -o app/src/main/jniLibs build -p panggung-core --release

      - name: Decode release keystore (if configured)
        id: sign
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/ci-release.jks"
            echo "keystore_path=${{ github.workspace }}/ci-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ steps.sign.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon \
            -PPANGGUNG_VERSION_NAME="${{ steps.ver.outputs.version_name }}" \
            -PPANGGUNG_VERSION_CODE="${{ steps.ver.outputs.version_code }}"

      - name: Prepare release artifacts & SHA256SUMS
        run: |
          mkdir -p dist
          APK_NAME="Panggung-Studio-${{ steps.ver.outputs.tag }}-arm64-v8a-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          (cd dist && sha256sum "${APK_NAME}" > SHA256SUMS.txt)
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Generate Release Notes
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VCODE: ${{ steps.ver.outputs.version_code }}
          REPO: ${{ github.repository }}
        run: |
          PREV_TAG="$(git tag --sort=-v:refname | grep -Fxv "$TAG" | head -n 1 || true)"
          if [ -n "$PREV_TAG" ]; then
            COMMITS="$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s (\`%h\`)" || true)"
            COMPARE_LINE="**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
          else
            COMMITS="$(git log -n 20 --no-merges --pretty=format:"- %s (\`%h\`)" || true)"
            COMPARE_LINE=""
          fi
          [ -n "$COMMITS" ] || COMMITS="- Release ${TAG}"
          APK_NAME="Panggung-Studio-${TAG}-arm64-v8a-release.apk"
          SHA256_VAL="$(awk '{print $1}' dist/SHA256SUMS.txt)"

          {
            echo "Standalone Live Streaming & Recording Studio for Android 10+ · \`arm64-v8a\` · \`io.panggung.obs\` · \`versionCode ${VCODE}\`"
            echo ""
            if [[ "$TAG" == *-* ]]; then
              echo "> **Pre-release (${TAG})**: Active development build for testing and feedback."
              echo ""
            fi
            echo "### What's Changed in ${TAG}"
            echo ""
            echo "$COMMITS"
            echo ""
            if [ -n "$COMPARE_LINE" ]; then
              echo "$COMPARE_LINE"
              echo ""
            fi
            echo "### Install / Cara Pasang"
            echo ""
            echo "Download **\`${APK_NAME}\`** below and install directly on Android 10+ (\`arm64-v8a\`), or via ADB:"
            echo '```sh'
            echo "adb install --no-streaming -r ${APK_NAME}"
            echo '```'
            echo ""
            echo "**SHA-256**: \`${SHA256_VAL}\`"
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Panggung Studio ${{ steps.ver.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ github.event.inputs.prerelease == 'true' || contains(steps.ver.outputs.tag, '-') }}
          generate_release_notes: false
          files: |
            dist/Panggung-Studio-${{ steps.ver.outputs.tag }}-arm64-v8a-release.apk
            dist/SHA256SUMS.txt
