[workspace]
resolver = "2"
members = [
    "crates/obs-sys",
    "crates/obs",
    "crates/panggung-core",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
jni = "0.21"
log = "0.4"
android_logger = "0.15"
thiserror = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
